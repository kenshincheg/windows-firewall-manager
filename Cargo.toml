[package]
name = "firewall_windows"
version = "0.4.2"
edition = "2024"
description = "GUI manager for Windows Firewall rules (egui + WinAPI COM)"
license = "MIT"
authors = ["firewall_windows"]

[dependencies]
eframe = { version = "0.32", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "accesskit",
] }
egui = "0.32"
# egui-wgpu отключает default-features у wgpu — без явного dx12 паника при старте.
wgpu = { version = "25", default-features = false, features = ["dx12", "wgsl"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
rfd = "0.15"
raw-window-handle = "0.6"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_SystemInformation",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }

[build-dependencies]
embed-resource = "3.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
